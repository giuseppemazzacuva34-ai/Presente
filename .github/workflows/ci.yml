# Verifica automatica a ogni pull request e a ogni modifica su main.
# La pubblicazione la fa Cloudflare Workers Builds (Worker «presente», landing e web app sotto /app/): niente Cloudflare Pages.
name: Verifica e pubblicazione

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: Verifica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Controlla che le azioni siano fissate e i permessi minimi
        run: python3 scripts/verifica_azioni.py

      - name: Verifica la landing della lista d'attesa
        if: hashFiles('landing/index.html') != ''
        run: python3 scripts/verifica_landing.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('worker/index.js') != ''
        with:
          node-version: 22

      - name: Test di sicurezza del Worker
        if: hashFiles('worker/index.js') != ''
        run: node scripts/test_worker.mjs

      - name: Controlla la configurazione del Worker (prova senza pubblicare)
        if: hashFiles('wrangler.jsonc') != ''
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker"
