# IndexNow (1/11, richiesta del Coordinatore e del SEO): dopo ogni pubblicazione della landing su main
# avvisa Bing (e gli altri motori che usano IndexNow) degli indirizzi della sitemap con <lastmod> nuovo.
# Solo indirizzi pubblici del sito: nessun dato personale, nessun segreto, nessun costo.
# Aspetta che Cloudflare Workers Builds abbia pubblicato (fino a 5 minuti), poi scrive nel log solo il codice di risposta.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["landing/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  avvisa:
    name: Avvisa i motori di ricerca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Invia gli indirizzi cambiati
        env:
          PRIMA: ${{ github.event_name == 'push' && github.event.before || '' }}
          DOPO: ${{ github.sha }}
        run: python3 scripts/sitemap.py indexnow "${PRIMA:-0}" "$DOPO"
