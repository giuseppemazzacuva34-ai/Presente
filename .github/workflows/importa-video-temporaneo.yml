# TEMPORANEO: importa il nuovo video della landing (prodotto nel workbench Composio) e si cancella prima della PR.
name: Importa video landing v3 (temporaneo)
on:
  push:
    branches: [studio/video-landing-v3]
    paths: [.github/workflows/importa-video-temporaneo.yml]
permissions:
  contents: write
jobs:
  importa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scarica e verifica i file
        run: |
          set -euo pipefail
          curl -fsSL -o landing/media/presente-v3.mp4 "https://backend.composio.dev/api/v3/sl/1NXPWpv_V-"
          curl -fsSL -o landing/media/presente-v3-poster.jpg "https://backend.composio.dev/api/v3/sl/SEMKRcRUtr"
          echo "93445901488ca38ff6fc99bf07904315973bb6f299f2782134cac0500390f4a7  landing/media/presente-v3.mp4" | sha256sum -c -
          echo "1e8495728df777ba9cd5f8ab0d958162d2d545efafffe6eec68373f21296869a  landing/media/presente-v3-poster.jpg" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/media/presente-v3.mp4 landing/media/presente-v3-poster.jpg
          git commit -m "Landing: file del video v3 e copertina, testi più leggibili"
          git push
