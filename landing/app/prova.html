<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <title>Presente · prova</title>
  <meta name="robots" content="noindex">

  <details class="comandi-prova">

    <div class="azioni">
      <button type="button" class="bottone-secondario" id="comando-profilo">Salta l'iscrizione</button>

    <p class="nota" id="esito-comando" role="status" aria-live="polite"></p>

  <div class="pagina app">

      <a class="logo" href="/app/prova.html" aria-label="Presente, ricomincia la prova">

        <svg viewBox="0 0 14 32" aria-hidden="true"><g transform="rotate(10 7 16)" fill="#e8432b"><rect x="4" y="1" width="6" height="20" rx="3"/><circle cx="7" cy="27" r="3.4"/></g></svg>

      <h1>Prova dell'app</h1>
      <p class="nota">Serve un browser aggiornato con JavaScript attivo.</p>
    </main>
    <p class="stato" id="stato" hidden></p>
