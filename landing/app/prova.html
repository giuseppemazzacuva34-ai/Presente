    <p class="nota">Dopo l'iscrizione, nella tua stanza:</p>

      <button type="button" class="bottone-secondario" id="comando-chiamata">Fatti chiamare</button>
      <button type="button" class="bottone-secondario" id="comando-minuto">Salta all'ultimo minuto</button>
      <button type="button" class="bottone-secondario" id="comando-porte">Domenica sera: apri le porte</button>
    </div>
    <p class="nota" id="esito-comando" role="status" aria-live="polite"></p>

  <div class="pagina app">

    </header>
    <main id="app">
      <h1>Prova dell'app</h1>
      <p class="nota">Serve un browser aggiornato con JavaScript attivo.</p>
    </main>
    <p class="stato" id="stato" hidden></p>
  </div>
